<div class="fk-confirm-dialog">
  <div class="fk-confirm-dialog__icon" [class.fk-confirm-dialog__icon--danger]="data.tone === 'danger'" [class.fk-confirm-dialog__icon--success]="data.tone === 'success'">
    <mat-icon>{{ data.icon || (data.tone === 'danger' ? 'warning_amber' : data.tone === 'success' ? 'check_circle' : 'help_outline') }}</mat-icon>
  </div>

  <h2 class="fk-confirm-dialog__title">{{ data.title }}</h2>
  <p class="fk-confirm-dialog__message">{{ data.message }}</p>

  <div class="fk-confirm-dialog__actions">
    <button mat-stroked-button type="button" (click)="cancel()">{{ data.cancelLabel || 'Cancel' }}</button>
    <button
      mat-flat-button
      type="button"
      [class.fk-confirm-dialog__confirm--danger]="data.tone === 'danger'"
      [class.fk-confirm-dialog__confirm--success]="data.tone === 'success'"
      (click)="confirm()"
    >
      {{ data.confirmLabel || 'Confirm' }}
    </button>
  </div>
</div>

<div class="app-role-page flex items-center justify-center">
  <div class="app-page app-page--narrow animate-fk-rise">
    <div class="app-empty-state">
      <mat-icon class="!text-red-500">gpp_bad</mat-icon>
      <h1 class="app-empty-state__title">Unauthorized access</h1>
      <p class="app-empty-state__text">
        You do not have permission to view this page. Sign in with the correct account or return to the home page.
      </p>
      <div class="flex flex-col sm:flex-row items-center justify-center gap-3 mt-6">
        <a mat-flat-button color="primary" class="app-primary-btn" routerLink="/auth/login">
          <mat-icon>login</mat-icon>
          Sign in
        </a>
        <a mat-stroked-button routerLink="/">
          <mat-icon>home</mat-icon>
          Go home
        </a>
      </div>
    </div>
  </div>
</div>
